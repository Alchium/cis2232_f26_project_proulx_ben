<!DOCTYPE html>

<!--Thanks to Ferhad, Francisco, and Carter from grad 2022 for the styling on this page.-->

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
    <title id="pageTitle" th:text="${session.title}">Match List</title>
</head>
<body>
<nav th:replace="~{fragments/navHeader :: navbar}"></nav>
<div class="container my-4">
    <h2 class="mb-3 text-center title">Fortnite Match List for Edit</h2>
    <h2 class="mb-3 text-center error" th:if="${not #strings.isEmpty(messageError)}" th:text="${messageError}">Message
        from controller</h2>
    <h2 class="mb-3 text-center success" th:if="${not #strings.isEmpty(messageSuccess)}" th:text="${messageSuccess}">
        Message success from controller</h2>

    <div class="table-responsive">
        <form action="#" th:action="@{/matchentry/list/edit/submit}" th:object="${form}"
              method="post">
            <fieldset>
                <input type="submit" id="submitButton" th:value="Save">
                <input type="reset" id="resetButton" name="reset" th:value="Reset"/>
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark text-center">
                    <tr>
                        <th> ID </th>
                        <th> Player Name </th>
                        <th> Current Rank </th>
                        <th> Rank Progress </th>
                        <th> Eliminations </th>
                        <th> Placement </th>
                        <th> Win </th>
                        <th> Match Date </th>
                        <th> Match Time </th>
                    </tr>
                    </thead>

                    <tbody>

<!--                    <tr th:each="book, itemStat : *{books}">-->
<!--                        <td><input th:field="*{books[__${itemStat.index}__].title}" /></td>-->
<!--                        <td><input th:field="*{books[__${itemStat.index}__].author}" /></td>-->

                    <tr th:each="current,itemStat : ${form.matchEntries}">
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].matchId}"/></td>
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].playerName}"></td>
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].currentRank}"></td>
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].rankProgress}"></td>
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].eliminations}"></td>
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].placement}"></td>
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].win}"></td>
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].matchDate}"></td>
                        <td><input th:field="*{matchEntries[__${itemStat.index}__].matchTime}"></td>
                    </tr>

                    <!-- Message when no data -->
                    <tr th:if="${#lists.isEmpty(form.matchEntries)}">
                        <td colspan="13" class="text-center text-muted py-4">
                            No matches found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </fieldset>
        </form>
    </div>


</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
