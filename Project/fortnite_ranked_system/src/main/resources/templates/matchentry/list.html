<!DOCTYPE html>

<!--Thanks to Ferhad, Francisco, and Carter from grad 2022 for the styling on this page.-->

<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
    <title id="pageTitle" th:text="${session.title}">Fortnite Match List</title>
</head>
<body>
<nav th:replace="~{fragments/navHeader :: navbar}"></nav>
<div class="container my-4">
    <h2 class="mb-3 text-center title">Fortnite Match List</h2>

    <h2 class="mb-3 text-center error"
        th:if="${not #strings.isEmpty(messageError)}"
        th:text="${messageError}" >
        Message from controller
    </h2>

    <h2 class="mb-3 text-center success"
        th:if="${not #strings.isEmpty(messageSuccess)}"
        th:text="${messageSuccess}" >
        Message success from controller
    </h2>

    <div class="table-responsive">
        <table id="theData" class="table table-striped table-hover align-middle">
            <thead class="table-dark text-center">
            <tr>
                <th> ID </th>
                <th> Player Name </th>
                <th> Current Rank </th>
                <th> Rank Progress </th>
                <th> Eliminations </th>
                <th> Placement </th>
                <th> Win </th>
                <th> Match Date </th>
                <th> Match Time </th>
                <th> Actions </th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="current : ${matchEntries}">
                <td th:text="${current.matchId}"></td>
                <td th:text="${current.playerName}"></td>
                <td th:text="${current.currentRank}"></td>
                <td th:text="${current.rankProgress}"></td>
                <td th:text="${current.eliminations}"></td>
                <td th:text="${current.placement}"></td>
                <td th:text="${current.win}"></td>
                <td th:text="${current.matchDate}"></td>
                <td th:text="${current.matchTime}"></td>

                <td class="text-center">
                    <div class="btn-group" role="group">
                        <a th:href="@{/matchentry/edit/{id}(id=${current.matchId})}"
                           class="btn btn-sm btn-outline-primary" title="Edit">
                            <i class="accent fas fa-edit"></i>
                        </a>
                        <a th:href="@{/matchentry/delete/{id}(id=${current.matchId})}"
                           class="btn btn-sm btn-outline-danger" title="Delete">
                            <i class="accent fas fa-trash"></i>
                        </a>
                    </div>
                </td>
            </tr>

            </tbody>
        </table>
    </div>

    <!-- Optional "Add new" button -->
    <div class="text-center mt-3">
        <a th:href="@{/matchentry/add}" href="/matchentry/add" class="accent accent-background btn btn-success">
            <i class="fas fa-plus"></i> Add New Match
        </a>
    </div>
</div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
